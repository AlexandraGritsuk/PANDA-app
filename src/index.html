<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANDA-app</title>
    <link rel="icon" href="assets/panda-app.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #ff6f61;
            color: white;
        }
        .collections {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .collection {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 10px;
            padding: 20px;
            text-align: center;
            width: 200px;
            transition: transform 0.2s;
        }
        .collection:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<header>
    <h1>PANDA-app</h1>
    <p>Предзапись на новые коллекции женской одежды "Panda"</p>
</header>

<div class="collections">
    <div class="collection">
        <h2>Коллекция 1</h2>
        <p>Описание коллекции 1</p>
    </div>
    <div class="collection">
        <h2>Коллекция 2</h2>
        <p>Описание коллекции 2</p>
    </div>
    <div class="collection">
        <h2>Коллекция 3</h2>
        <p>Описание коллекции 3</p>
    </div>
</div>

</body>
</html>
